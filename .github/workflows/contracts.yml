name: Contracts

on:
  push:
    branches: ["feat/*", main]
    paths: [contracts/**]
  pull_request:
    branches: [master]
    paths: [contracts/**]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/anchor
            ~/.cargo/bin/avm
            ~/.avm
            contracts/target
          key: cargo-anchor-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: cargo-anchor-

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: solana-cli-stable-${{ runner.os }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        run: |
          if ! anchor --version 2>/dev/null | grep -q "1.0.0"; then
            cargo install --git https://github.com/coral-xyz/anchor avm --force
            avm install 1.0.0
            avm use 1.0.0
          fi

      - name: Build
        working-directory: contracts
        run: NO_DNA=1 anchor build --ignore-keys

      - name: Install JS deps
        working-directory: contracts
        run: yarn install --frozen-lockfile

      - name: Test
        working-directory: contracts
        run: yarn test
