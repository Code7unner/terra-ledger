[package]
name = "lien-registry"
version = "0.1.0"
description = "TerraLedger encumbrance/lien registry layer"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lien_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
terra-token = { path = "../terra_token", features = ["cpi"] }
